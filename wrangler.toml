name = "c0digos-para-compartir-por-whatsapp"
type = "javascript"
main = "src/index.js"
compatibility_date = "2024-12-19"

[env.production]
routes = [
  { pattern = "c0digos-para-compartir-por-whatsapp.pages.dev", zone_name = "c0digos-para-compartir-por-whatsapp.pages.dev" }
]

[build]
command = "npm run build"
cwd = "./"
watch_paths = [
  "index.html",
  "wallpapers/**",
  "_headers",
  "_redirects",
  "robots.txt",
  "sitemap.xml",
  "llms.txt",
  "package.json",
  "ads.txt",
  "ai-catalog.json",
  "*.js",
  "*.css"
]
