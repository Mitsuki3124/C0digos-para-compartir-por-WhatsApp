<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demo Rust + WebAssembly</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;line-height:1.5}
  section{border:1px solid #ccc;border-radius:12px;padding:1rem;margin:1rem 0}
  input,button{font:inherit;padding:.5rem .8rem;border-radius:8px;border:1px solid #999}
  button{cursor:pointer}
  pre{background:#f4f4f4;padding:.8rem;border-radius:8px;white-space:pre-wrap}
  #estado{font-weight:700}
</style>
</head>
<body>
<h1>🦀 Rust + WebAssembly</h1>
<p id="estado">Cargando…</p>

<section>
  <h2>1. Función mínima</h2>
  <input id="nombre" placeholder="Tu nombre">
  <button id="btnSaludo">Saludar desde Rust</button>
  <p id="saludo"></p>
</section>

<section>
  <h2>2. Búsqueda sin acentos</h2>
  <input id="busqueda" placeholder="Prueba: jardin, cancion, perdon…">
  <ul id="resultados"></ul>
</section>

<section>
  <h2>3. Cálculo pesado: JS vs Rust</h2>
  <button id="btnBench">Ejecutar</button>
  <pre id="bench"></pre>
</section>

<p><a href="./">← Volver al sitio</a></p>
<script type="module" src="./wasm-demo.js" _nonce="1"></script>
</body>
</html>
