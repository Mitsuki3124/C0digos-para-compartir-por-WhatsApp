[package]
name = "sitio-wasm"
version = "0.1.0"
edition = "2021"
description = "Funciones Rust compiladas a WebAssembly para el sitio estatico"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# wasm-opt: el Rust nuevo emite memory.copy/fill (bulk memory); hay que habilitarlo para optimizar.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-bulk-memory-opt", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
